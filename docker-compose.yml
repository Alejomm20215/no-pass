version: '3.8'

services:
  pdf-password-tools:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount local directories for development
      - ./data/uploads:/app/data/uploads
      - ./data/outputs:/app/data/outputs
      - ./logs:/app/logs
      - ./config/wordlists:/app/config/wordlists
    environment:
      - DEBUG=true
      - MAX_FILE_SIZE=104857600  # 100MB
      - UPLOAD_DIR=/app/data/uploads
      - OUTPUT_DIR=/app/data/outputs
      - WORDLIST_DIR=/app/config/wordlists
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

